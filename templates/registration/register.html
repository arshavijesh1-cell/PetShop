{% extends 'base.html' %}

{% block title %}
Register - PetShop
{% endblock %}


{% block content %}

<style>

/* ===================================================== */
/* REGISTER SECTION */
/* ===================================================== */

.register-section {

    min-height: 78vh;

    padding: 65px 0;

    background:
        linear-gradient(
            135deg,
            #fff8f2,
            #f8f9fa
        );

    display: flex;

    align-items: center;

}


/* ===================================================== */
/* REGISTER CARD */
/* ===================================================== */

.register-card {

    width: 100%;

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 42px;

    border-radius: 22px;

    border: 1px solid #eeeeee;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.08);

}


/* ===================================================== */
/* HEADER */
/* ===================================================== */

.register-header {

    text-align: center;

    margin-bottom: 32px;

}


.register-icon {

    width: 68px;

    height: 68px;

    margin: 0 auto 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #fff1e3;

    color: #ff7a00;

    font-size: 30px;

}


.register-title {

    font-size: 29px;

    font-weight: 800;

    color: #222;

    margin-bottom: 7px;

}


.register-subtitle {

    color: #777;

    font-size: 14px;

    margin-bottom: 0;

}


/* ===================================================== */
/* FORM */
/* ===================================================== */

.form-group {

    margin-bottom: 18px;

}


.form-label {

    display: block;

    font-size: 14px;

    font-weight: 700;

    color: #333;

    margin-bottom: 8px;

}


.required {

    color: #dc3545;

}


.input-wrapper {

    position: relative;

}


.input-icon {

    position: absolute;

    left: 14px;

    top: 50%;

    transform: translateY(-50%);

    color: #999;

    font-size: 16px;

    pointer-events: none;

}


.form-control {

    width: 100%;

    min-height: 48px;

    padding: 11px 13px 11px 42px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 14px;

    transition: 0.25s;

}


.form-control:focus {

    border-color: #ff7a00;

    box-shadow:
        0 0 0 0.2rem rgba(255, 122, 0, 0.12);

}


/* ===================================================== */
/* PASSWORD NOTE */
/* ===================================================== */

.password-note {

    color: #999;

    font-size: 12px;

    margin-top: 7px;

}


/* ===================================================== */
/* REGISTER BUTTON */
/* ===================================================== */

.register-btn {

    width: 100%;

    min-height: 49px;

    margin-top: 5px;

    border: none;

    border-radius: 9px;

    background: #ff7a00;

    color: white;

    font-size: 15px;

    font-weight: 700;

    transition: 0.3s;

}


.register-btn:hover {

    background: #e66d00;

    color: white;

    transform: translateY(-2px);

    box-shadow:
        0 6px 18px rgba(255,122,0,0.22);

}


/* ===================================================== */
/* LOGIN LINK */
/* ===================================================== */

.login-link-box {

    text-align: center;

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #eeeeee;

    font-size: 14px;

}


.login-link {

    color: #ff7a00;

    font-weight: 700;

    text-decoration: none;

}


.login-link:hover {

    color: #e66d00;

}


/* ===================================================== */
/* RESPONSIVE */
/* ===================================================== */

@media (max-width: 576px) {

    .register-section {

        padding: 40px 15px;

    }


    .register-card {

        padding: 30px 22px;

        border-radius: 18px;

    }


    .register-title {

        font-size: 25px;

    }

}

</style>



<!-- ===================================================== -->
<!-- REGISTER SECTION -->
<!-- ===================================================== -->

<section class="register-section">

    <div class="container">


        <div class="register-card">


            <!-- ================================================= -->
            <!-- HEADER -->
            <!-- ================================================= -->

            <div class="register-header">


                <div class="register-icon">

                    <i class="bi bi-person-plus-fill"></i>

                </div>


                <h1 class="register-title">

                    Create Account

                </h1>


                <p class="register-subtitle">

                    Join PetShop and start shopping
                    for your lovely pets.

                </p>

            </div>



            <!-- ================================================= -->
            <!-- REGISTER FORM -->
            <!-- ================================================= -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label class="form-label">

                        Username

                        <span class="required">*</span>

                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-person input-icon"></i>


                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label class="form-label">

                        Email Address

                        <span class="required">*</span>

                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-envelope input-icon"></i>


                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label class="form-label">

                        Password

                        <span class="required">*</span>

                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-lock input-icon"></i>


                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                    </div>


                    <div class="password-note">

                        <i class="bi bi-info-circle me-1"></i>

                        Choose a secure password for your account.

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label class="form-label">

                        Confirm Password

                        <span class="required">*</span>

                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-shield-lock input-icon"></i>


                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

                    </div>

                </div>



                <!-- REGISTER -->

                <button
                    type="submit"
                    class="register-btn">

                    <i class="bi bi-person-plus me-2"></i>

                    Create Account

                </button>


            </form>



            <!-- ================================================= -->
            <!-- LOGIN -->
            <!-- ================================================= -->

            <div class="login-link-box">

                <span class="text-secondary">

                    Already have an account?

                </span>


                <a
                    href="{% url 'login' %}"
                    class="login-link ms-1">

                    Login

                </a>

            </div>


        </div>

    </div>

</section>

{% endblock %}
