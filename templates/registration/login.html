{% extends 'base.html' %}

{% block title %}
Login - PetShop
{% endblock %}


{% block content %}

<style>

    .auth-section {
        min-height: 78vh;
        background: linear-gradient(135deg, #fff8f1, #f8f9fa);
        display: flex;
        align-items: center;
        padding: 60px 0;
    }

    .auth-card {
        background: #ffffff;
        max-width: 440px;
        margin: auto;
        padding: 42px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.09);
    }

    .auth-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #fff0e2;
        color: #ff7a00;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
    }

    .auth-title {
        text-align: center;
        font-weight: 800;
        color: #222;
        margin-bottom: 8px;
    }

    .auth-subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
    }

    .input-group-text {
        background: #fff;
        border-right: none;
        color: #ff7a00;
    }

    .form-control {
        padding: 12px;
        border-radius: 8px;
        border-left: none;
    }

    .form-control:focus {
        border-color: #ff7a00;
        box-shadow: 0 0 0 0.2rem rgba(255, 122, 0, 0.12);
    }

    .input-group:focus-within .input-group-text {
        border-color: #ff7a00;
    }

    .login-btn {
        width: 100%;
        background: #ff7a00;
        color: white;
        border: none;
        padding: 13px;
        border-radius: 9px;
        font-weight: 700;
        font-size: 16px;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #e66d00;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 6px 15px rgba(255, 122, 0, 0.25);
    }

    .register-link {
        color: #ff7a00;
        font-weight: 600;
        text-decoration: none;
    }

    .register-link:hover {
        color: #e66d00;
    }

</style>


<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <!-- Icon -->

            <div class="auth-icon">

                <i class="bi bi-person-check"></i>

            </div>


            <!-- Title -->

            <h2 class="auth-title">
                Welcome Back!
            </h2>


            <p class="auth-subtitle">
                Login to your PetShop account
            </p>


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required>

                    </div>

                </div>


                <!-- Password -->

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login

                </button>

            </form>


            <!-- Register -->

            <div class="text-center mt-4">

                <span class="text-secondary">
                    Don't have an account?
                </span>

                <a
                    href="{% url 'register' %}"
                    class="register-link">

                    Register

                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
